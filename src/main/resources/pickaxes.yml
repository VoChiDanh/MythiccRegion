# ==============================================================================
# MythiccRegion - Pickaxe Profiles Configuration (pickaxes.yml)
# All parameters are 100% customizable without hardcoded values.
# Full sample configs mapped directly from D:\Server\Mythicc\plugins\MythicMobs:
# - Mining_Items.yml (MinePickaxe_Tier1 to Tier10)
# - Cup3x3_Items.yml (CupNo3x3_1 to CupNo3x3_12)
# - Cup5x5_Items.yml (CupNo5x5_1)
# ==============================================================================

default-profile:
  mining-power: 1
  damage-per-hit: 1
  break-radius: 0
  multiplier-bonus: 0.0
  direct-to-inventory: false

pickaxes:
  # ============================================================================
  # 1. MYTHICMOBS MINING PICKAXES: 10 RPG TIERS (MinePickaxe_Tier1 -> Tier10)
  # ============================================================================
  MinePickaxe_Tier1:
    mythic-item: "MinePickaxe_Tier1"
    mining-power: 1
    damage-per-hit: 1
    break-radius: 0
    multiplier-bonus: 0.15
    direct-to-inventory: false
    break-sound:
      name: "block.stone.break"
      volume: 1.0
      pitch: 1.2
    break-particle: "CRIT"

