# ==============================================================================
# MythiccRegion - Mine Regions Configuration (mines.yml)
# Fully integrated 8 resource types x 3 tiers (24 MythicMobs materials):
# - Tier 1: Refined (Special_) -> Mine Tier 1, Tier 2, Tier 3
# - Tier 2: Pure (Pure_)        -> Mine Tier 4, Tier 5
# - Tier 3: Astral (Astral_)    -> Mine Tier 6 (Astral Void Realm)
#
# Sequenced Regeneration (regen-pool):
# Each mine contains multiple block types. When mined, the block turns into replace-block
# (BEDROCK) while awaiting respawn, then regenerates into the next block based on weighted percentages.
# ==============================================================================

regions:
  # ============================================================================
  # MINE TIER 1: PROSPECTOR'S VALLEY (Required Tool: Tier 1 - Tier 2)
  # Resource Drops: Wood, Stone, Coal, Copper (Refined)
  # WorldGuard region: 'mine_tier1' or flag 'mine-id: mine_tier1'
  # ============================================================================
  mine_tier1:
    worldguard-region: "mine_tier1"
    blocks:
      # 1. Base Stone Block
      STONE:
        respawn-time: 8
        replace-block: "BEDROCK"
        hardness-hits: 2
        required-mining-power: 1
        regen-pool:
          STONE: 65.0
          COAL_ORE: 20.0
          COPPER_ORE: 10.0
          OAK_LOG: 5.0
        drops:
          stone_drop:
            mythic-item: "Special_Stone"
            min-amount: 1
            max-amount: 2
            chance: 100.0
            multipliers:
              3: 5.0
              2: 20.0

      # 2. Coal Ore Block
      COAL_ORE:
        respawn-time: 12
        replace-block: "BEDROCK"
        hardness-hits: 3
        required-mining-power: 1
        regen-pool:
          STONE: 45.0
          COAL_ORE: 40.0
          COPPER_ORE: 15.0
        drops:
          coal_drop:
            mythic-item: "Special_Coal"
            min-amount: 1
            max-amount: 3
            chance: 100.0
            multipliers:
              4: 2.0
              3: 8.0
              2: 25.0

      # 3. Copper Ore Block
      COPPER_ORE:
        respawn-time: 15
        replace-block: "BEDROCK"
        hardness-hits: 4
        required-mining-power: 2
        regen-pool:
          STONE: 50.0
          COAL_ORE: 25.0
          COPPER_ORE: 25.0
        drops:
          copper_drop:
            mythic-item: "Special_Copper_Ingot"
            min-amount: 1
            max-amount: 3
            chance: 100.0
            multipliers:
              3: 10.0
              2: 25.0

      # 4. Ancient Oak Log
      OAK_LOG:
        respawn-time: 10
        replace-block: "BEDROCK"
        hardness-hits: 2
        required-mining-power: 1
        regen-pool:
          OAK_LOG: 60.0
          STONE: 40.0
        drops:
          wood_drop:
            mythic-item: "Special_Wood"
            min-amount: 1
            max-amount: 3
            chance: 100.0
            multipliers:
              3: 5.0
              2: 20.0

